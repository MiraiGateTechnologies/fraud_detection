<title>Seven Rules Fraud Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=Public+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">

<style>
:root{
  --bg:#FAF9F6; --surface:#FFFFFF; --surface-2:#F3F1EB; --surface-3:#EDEAE1;
  --ink:#191814; --ink-2:#403C33; --muted:#6E6A61; --line:#E4E0D8; --line-2:#D3CDC0;
  --accent:#8A6A14; --accent-soft:#F0E6CC; --accent-ink:#6B5210;
  --crit:#A63D2A; --crit-bg:#F6E3DE;
  --high:#B07818; --high-bg:#F7EBD5;
  --low:#6E6A61;  --low-bg:#EAE7E0;
  --pos:#3F6B47;  --neg:#A63D2A;
  --shadow:0 1px 2px rgba(25,24,20,.05), 0 8px 24px -12px rgba(25,24,20,.15);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#181712; --surface:#211F19; --surface-2:#282520; --surface-3:#302C25;
    --ink:#F0EEE7; --ink-2:#D3CEC2; --muted:#9B968A; --line:#332F27; --line-2:#443F35;
    --accent:#D4A54A; --accent-soft:#3A3122; --accent-ink:#E4BC6B;
    --crit:#E07A5F; --crit-bg:#3B2620;
    --high:#DCA340; --high-bg:#3A2E1B;
    --low:#9B968A;  --low-bg:#2A2822;
    --pos:#7FB08A;  --neg:#E07A5F;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --bg:#181712; --surface:#211F19; --surface-2:#282520; --surface-3:#302C25;
  --ink:#F0EEE7; --ink-2:#D3CEC2; --muted:#9B968A; --line:#332F27; --line-2:#443F35;
  --accent:#D4A54A; --accent-soft:#3A3122; --accent-ink:#E4BC6B;
  --crit:#E07A5F; --crit-bg:#3B2620;
  --high:#DCA340; --high-bg:#3A2E1B;
  --low:#9B968A;  --low-bg:#2A2822;
  --pos:#7FB08A;  --neg:#E07A5F;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.6);
}

*{box-sizing:border-box}
body{margin:0; background:var(--bg); color:var(--ink);
  font-family:"Public Sans","Segoe UI",system-ui,sans-serif; font-size:16px; line-height:1.6;
  -webkit-font-smoothing:antialiased}
.wrap{max-width:1240px; margin:0 auto; padding:0 24px 80px}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace; font-variant-numeric:tabular-nums}

header{padding:52px 0 26px; border-bottom:2px solid var(--ink)}
.eyebrow{font-family:"IBM Plex Mono",monospace; font-size:11px; font-weight:500;
  letter-spacing:.16em; text-transform:uppercase; color:var(--accent); margin:0 0 16px}
h1{font-family:"Archivo",sans-serif; font-weight:700; font-size:clamp(2.1rem,5vw,3.2rem);
  line-height:1.04; letter-spacing:-.032em; margin:0 0 14px; text-wrap:balance}
.lede{font-size:1.06rem; color:var(--ink-2); max-width:68ch; margin:0}

.stats{display:grid; grid-template-columns:repeat(auto-fit,minmax(168px,1fr)); gap:12px;
  margin-top:26px}
.stat{background:var(--surface); border:1px solid var(--line); border-radius:3px;
  padding:16px 18px; box-shadow:var(--shadow)}
.stat.hl{background:var(--crit-bg); border-color:var(--crit)}
.stat .n{font-family:"Archivo",sans-serif; font-size:2.15rem; font-weight:700; line-height:1;
  letter-spacing:-.035em; font-variant-numeric:tabular-nums; color:var(--ink)}
.stat.hl .n{color:var(--crit)}
.stat .l{font-size:.82rem; color:var(--muted); margin-top:8px; line-height:1.35}
.stat .l b{color:var(--ink-2); font-weight:600}

.tabs{display:flex; flex-wrap:wrap; gap:7px; margin-top:26px}
.tabs button{font-family:"Public Sans",sans-serif; font-size:.88rem; font-weight:600;
  padding:9px 15px; border:1px solid var(--line-2); border-radius:3px; background:var(--surface);
  color:var(--muted); cursor:pointer; display:flex; align-items:baseline; gap:7px;
  transition:background .12s,color .12s,border-color .12s}
.tabs button .c{font-family:"IBM Plex Mono",monospace; font-size:.75rem; font-weight:500;
  font-variant-numeric:tabular-nums}
.tabs button:hover{border-color:var(--accent); color:var(--ink-2)}
.tabs button[aria-selected="true"]{background:var(--accent); border-color:var(--accent); color:#fff}
.tabs button[aria-selected="true"] .c{color:rgba(255,255,255,.82)}
.tabs button:focus-visible{outline:2px solid var(--accent); outline-offset:2px}

h3.sec{font-family:"Archivo",sans-serif; font-weight:600; font-size:1.15rem;
  margin:32px 0 6px; letter-spacing:-.015em}
.sub{color:var(--muted); margin:0 0 18px; max-width:76ch; font-size:.92rem}

/* overview grid */
.ovgrid{display:grid; grid-template-columns:repeat(auto-fit,minmax(288px,1fr)); gap:14px;
  margin-top:20px}
.ovcard{background:var(--surface); border:1px solid var(--line); border-left:4px solid var(--accent);
  border-radius:3px; padding:18px 20px; box-shadow:var(--shadow); cursor:pointer;
  text-align:left; font-family:inherit; display:flex; flex-direction:column; gap:9px;
  transition:box-shadow .12s,border-left-color .12s}
.ovcard:hover{box-shadow:0 2px 4px rgba(25,24,20,.07),0 14px 30px -14px rgba(25,24,20,.28)}
.ovcard:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
.ovhead{display:flex; align-items:baseline; justify-content:space-between; gap:12px}
.ovid{font-family:"IBM Plex Mono",monospace; font-size:11px; font-weight:600;
  letter-spacing:.09em; color:var(--accent); text-transform:uppercase}
.ovn{font-family:"Archivo",sans-serif; font-size:1.85rem; font-weight:700; line-height:1;
  letter-spacing:-.03em; font-variant-numeric:tabular-nums}
.ovt{font-family:"Archivo",sans-serif; font-size:1.02rem; font-weight:600; letter-spacing:-.012em;
  margin:0}
.ovg{font-size:.855rem; color:var(--ink-2); margin:0; line-height:1.5}
.ovfoot{font-family:"IBM Plex Mono",monospace; font-size:.75rem; color:var(--muted);
  border-top:1px solid var(--line); padding-top:9px; margin-top:2px;
  display:flex; justify-content:space-between; gap:10px}

/* overlap bars */
.olap{background:var(--surface); border:1px solid var(--line); border-radius:3px;
  padding:19px 21px; margin-top:20px; box-shadow:var(--shadow)}
.olrow{display:grid; grid-template-columns:104px 1fr 78px; gap:13px; align-items:center;
  margin-bottom:11px; font-size:.875rem}
.olrow:last-child{margin-bottom:0}
.ollab{color:var(--ink-2)}
.olbar{height:19px; background:var(--surface-3); border-radius:2px; overflow:hidden}
.olbar i{display:block; height:100%; background:var(--accent); border-radius:2px}
.olrow.hot .olbar i{background:var(--crit)}
.olct{font-family:"IBM Plex Mono",monospace; font-size:.81rem; color:var(--muted);
  text-align:right; font-variant-numeric:tabular-nums}

/* rule card */
.rulebox{background:var(--surface); border:1px solid var(--line); border-radius:3px;
  margin-top:24px; box-shadow:var(--shadow); overflow:hidden}
.rulebox .top{padding:18px 22px; border-bottom:1px solid var(--line); background:var(--surface-2)}
.rulebox h2{font-family:"Archivo",sans-serif; font-size:1.22rem; font-weight:600;
  margin:0 0 6px; letter-spacing:-.015em}
.rulebox .top p{margin:0; color:var(--ink-2); font-size:.95rem; max-width:80ch}
.rulebox .body{padding:20px 22px; display:grid; gap:16px;
  grid-template-columns:repeat(auto-fit,minmax(290px,1fr))}
.blk .lbl{font-family:"IBM Plex Mono",monospace; font-size:10px; letter-spacing:.11em;
  text-transform:uppercase; color:var(--accent); display:block; margin-bottom:7px; font-weight:600}
.blk p{margin:0; font-size:.9rem; color:var(--ink-2)}
.blk code.th{font-family:"IBM Plex Mono",monospace; font-size:.78rem; color:var(--ink-2);
  background:var(--surface-2); border:1px solid var(--line); border-radius:3px;
  padding:9px 12px; display:block; line-height:1.65; white-space:pre-wrap}

/* filters */
.filters{background:var(--surface); border:1px solid var(--line); border-radius:3px;
  padding:17px 19px; margin-top:20px; display:flex; flex-wrap:wrap; gap:15px 20px;
  align-items:flex-end; box-shadow:var(--shadow)}
.fgroup{display:flex; flex-direction:column; gap:7px; min-width:0}
.flab{font-family:"IBM Plex Mono",monospace; font-size:10px; letter-spacing:.11em;
  text-transform:uppercase; color:var(--muted)}
input[type="search"], select{font-family:"Public Sans",sans-serif; font-size:.89rem;
  color:var(--ink); background:var(--surface-2); border:1px solid var(--line-2);
  border-radius:3px; padding:8px 11px; min-width:175px; max-width:100%}
input[type="search"]:focus, select:focus{outline:2px solid var(--accent); outline-offset:-1px}
input[type="range"]{width:168px; accent-color:var(--accent)}
.rangeval{font-family:"IBM Plex Mono",monospace; font-size:.8rem; color:var(--ink-2); margin-left:8px}
.chip{font-family:"IBM Plex Mono",monospace; font-size:11px; font-weight:600; padding:7px 12px;
  border-radius:99px; border:1px solid var(--line-2); background:var(--surface-2);
  color:var(--muted); cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent); border-color:var(--accent); color:#fff}
.chip:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
.reset{font-family:"Public Sans",sans-serif; font-size:.85rem; font-weight:600; background:none;
  border:1px solid var(--line-2); color:var(--muted); padding:8px 14px; border-radius:3px;
  cursor:pointer}
.reset:hover{border-color:var(--crit); color:var(--crit)}
.reset:focus-visible{outline:2px solid var(--accent); outline-offset:2px}

.resbar{display:flex; flex-wrap:wrap; gap:10px 20px; align-items:baseline; margin-top:19px;
  padding-bottom:11px; border-bottom:1px solid var(--line)}
.rescount{font-family:"Archivo",sans-serif; font-size:1.04rem; font-weight:600}
.rescount b{color:var(--accent); font-variant-numeric:tabular-nums}
.resmoney{font-family:"IBM Plex Mono",monospace; font-size:.82rem; color:var(--muted)}
.resmoney b{color:var(--ink-2); font-weight:500}

/* table */
.scroll{overflow-x:auto; border:1px solid var(--line); border-radius:3px; background:var(--surface)}
table{width:100%; border-collapse:collapse; font-size:.86rem; min-width:840px}
th{position:sticky; top:0; z-index:2; text-align:left; font-family:"IBM Plex Mono",monospace;
  font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted);
  font-weight:500; padding:12px 13px; background:var(--surface-3);
  border-bottom:1px solid var(--line-2); white-space:nowrap; cursor:pointer; user-select:none}
th:hover{color:var(--accent)}
th .arw{opacity:.35; margin-left:5px}
th[data-active="1"]{color:var(--accent)} th[data-active="1"] .arw{opacity:1}
th.r,td.r{text-align:right}
td{padding:11px 13px; border-bottom:1px solid var(--line); color:var(--ink-2); vertical-align:middle}
tr.row{cursor:pointer}
tr.row:hover, tr.row.open{background:var(--surface-2)}
tbody tr:last-child td{border-bottom:none}
.pid{font-family:"IBM Plex Mono",monospace; font-size:.83rem; font-weight:600; color:var(--ink);
  word-break:break-all; display:block}
.pname{font-size:.73rem; color:var(--muted); margin-top:2px; display:block}
.newpill{font-family:"IBM Plex Mono",monospace; font-size:9.5px; font-weight:600;
  color:var(--crit); display:block; margin-top:2px}
.num{font-family:"IBM Plex Mono",monospace; font-variant-numeric:tabular-nums;
  font-size:.88rem; color:var(--ink); font-weight:500}
.num.pos{color:var(--pos)} .num.neg{color:var(--neg)}
.tags{display:flex; flex-wrap:wrap; gap:3px; justify-content:flex-end}
.tag{font-family:"IBM Plex Mono",monospace; font-size:9.5px; font-weight:600; padding:2px 6px;
  border-radius:2px; background:var(--accent-soft); color:var(--accent-ink)}
.tag.self{background:var(--accent); color:#fff}
.hits{display:inline-block; font-family:"IBM Plex Mono",monospace; font-size:10px;
  font-weight:600; padding:3px 8px; border-radius:3px; background:var(--low-bg); color:var(--low)}
.hits.h2{background:var(--high-bg); color:var(--high)}
.hits.h3{background:var(--crit); color:#fff}
.exp{font-family:"IBM Plex Mono",monospace; color:var(--muted); font-size:.88rem}

/* fraud confirm tick */
th.tickhead{cursor:default; color:var(--crit)}
th.tickhead:hover{color:var(--crit)}
td.tickcell{width:1%; white-space:nowrap; text-align:center}
.tick{appearance:none; -webkit-appearance:none; width:20px; height:20px; margin:0;
  border:1.5px solid var(--line-2); border-radius:3px; background:var(--surface);
  cursor:pointer; display:inline-grid; place-content:center; vertical-align:middle;
  transition:background .1s,border-color .1s}
.tick:hover{border-color:var(--crit)}
.tick:checked{background:var(--crit); border-color:var(--crit)}
.tick:checked::after{content:"\2713"; color:#fff; font-size:13px; font-weight:700; line-height:1}
.tick:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
tr.row.confirmed td{background:var(--crit-bg)}
tr.row.confirmed .pid{color:var(--crit)}

.reviewbar{display:flex; flex-wrap:wrap; gap:12px 18px; align-items:center;
  margin-top:14px; padding:14px 18px; background:var(--surface); border:1px solid var(--line);
  border-left:4px solid var(--crit); border-radius:3px; box-shadow:var(--shadow)}
.reviewbar.zero{border-left-color:var(--line-2)}
.rvn{font-family:"Archivo",sans-serif; font-size:1.55rem; font-weight:700; line-height:1;
  color:var(--crit); font-variant-numeric:tabular-nums}
.reviewbar.zero .rvn{color:var(--muted)}
.rvt{font-size:.88rem; color:var(--ink-2); flex:1 1 240px}
.rvt b{color:var(--ink)}
.rvbtn{font-family:"Public Sans",sans-serif; font-size:.85rem; font-weight:600;
  background:var(--surface-2); border:1px solid var(--line-2); color:var(--ink-2);
  padding:8px 14px; border-radius:3px; cursor:pointer}
.rvbtn:hover:not(:disabled){border-color:var(--accent); color:var(--accent)}
.rvbtn:disabled{opacity:.4; cursor:default}
.rvbtn.danger:hover:not(:disabled){border-color:var(--crit); color:var(--crit)}
.rvbtn:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
.rvmsg{font-family:"IBM Plex Mono",monospace; font-size:.78rem; color:var(--pos)}
.rvfall{margin-top:10px; padding:15px 18px; background:var(--surface-2);
  border:1px solid var(--line-2); border-radius:3px}
.rvfall p{margin:0 0 10px; font-size:.86rem; color:var(--ink-2)}
.rvfall p b{color:var(--ink); font-family:"IBM Plex Mono",monospace; font-size:.82rem}
.rvfall textarea{width:100%; font-family:"IBM Plex Mono",monospace; font-size:.76rem;
  line-height:1.6; color:var(--ink); background:var(--surface); border:1px solid var(--line-2);
  border-radius:3px; padding:10px 12px; resize:vertical; margin-bottom:10px;
  white-space:pre; overflow-x:auto}
.rvfall textarea:focus{outline:2px solid var(--accent); outline-offset:-1px}

/* detail */
tr.detail td{background:var(--surface-2); border-bottom:2px solid var(--line-2); padding:0}
.dwrap{padding:19px 21px; display:grid; gap:19px;
  grid-template-columns:repeat(auto-fit,minmax(258px,1fr))}
.dgrp h4{font-family:"IBM Plex Mono",monospace; font-size:10px; letter-spacing:.11em;
  text-transform:uppercase; color:var(--accent); margin:0 0 10px; font-weight:600}
.dgrp dl{display:grid; grid-template-columns:1fr auto; gap:7px 13px; margin:0; font-size:.84rem}
.dgrp dt{color:var(--muted)}
.dgrp dd{margin:0; font-family:"IBM Plex Mono",monospace; font-variant-numeric:tabular-nums;
  color:var(--ink); font-weight:500; text-align:right}
.dgrp dd.pos{color:var(--pos)} .dgrp dd.neg{color:var(--neg)}
.dnote{grid-column:1/-1; font-size:.85rem; color:var(--ink-2); background:var(--surface);
  border:1px solid var(--line); border-left:3px solid var(--accent); border-radius:3px;
  padding:12px 15px; margin:0}
.dnote b{color:var(--ink)}
.wl{grid-column:1/-1}
.wl h4{font-family:"IBM Plex Mono",monospace; font-size:10px; letter-spacing:.11em;
  text-transform:uppercase; color:var(--accent); margin:0 0 8px; font-weight:600}
.wl code{font-family:"IBM Plex Mono",monospace; font-size:.72rem; line-height:1.85;
  word-break:break-all; display:block; background:var(--surface); border:1px solid var(--line);
  border-radius:3px; padding:10px 12px; color:var(--muted)}
.wl code b{color:var(--pos); font-weight:600}
.wl code i{color:var(--neg); font-style:normal}

.empty{padding:54px 24px; text-align:center; color:var(--muted)}
.empty b{display:block; font-family:"Archivo",sans-serif; font-size:1.04rem;
  color:var(--ink-2); margin-bottom:6px}
.pager{display:flex; flex-wrap:wrap; gap:12px; align-items:center;
  justify-content:space-between; margin-top:16px}
.pgbtns{display:flex; gap:7px}
.pgbtns button{font-family:"IBM Plex Mono",monospace; font-size:.81rem; background:var(--surface);
  border:1px solid var(--line-2); color:var(--ink-2); padding:7px 12px; border-radius:3px;
  cursor:pointer}
.pgbtns button:hover:not(:disabled){border-color:var(--accent); color:var(--accent)}
.pgbtns button:disabled{opacity:.35; cursor:default}
.pgbtns button:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
.pginfo{font-family:"IBM Plex Mono",monospace; font-size:.8rem; color:var(--muted)}

.note{margin-top:30px; background:var(--crit-bg); border:1px solid var(--crit);
  border-radius:3px; padding:20px 23px}
.note h3{font-family:"Archivo",sans-serif; font-size:1rem; font-weight:600; margin:0 0 8px;
  color:var(--crit)}
.note p{margin:0 0 8px; color:var(--ink-2); font-size:.91rem; max-width:78ch}
.note p:last-child{margin-bottom:0}
.note strong{color:var(--ink)}
footer{margin-top:46px; padding-top:20px; border-top:1px solid var(--line);
  font-family:"IBM Plex Mono",monospace; font-size:11.5px; color:var(--muted);
  display:flex; flex-wrap:wrap; gap:8px 26px}
@media (prefers-reduced-motion:reduce){ *{transition:none !important} }
@media(max-width:640px){ .rulebox .body{grid-template-columns:1fr} }
</style>

<script>
(function(){
"use strict";
var h = htm.bind(React.createElement);
var useState = React.useState, useMemo = React.useMemo, useEffect = React.useEffect;
var D = window.__DATA__;
var RULES = D.rules, META = D.meta;
var PAGE = 25;

/* ---------- formatting ---------- */
function inr(n){
  if(n===null||n===undefined||n==="") return "—";
  if(typeof n!=="number") return String(n);
  var s = Math.abs(n) >= 1000 ? Math.round(n).toLocaleString("en-IN")
                              : (Math.round(n*100)/100).toLocaleString("en-IN");
  return (n<0?"−₹":"₹")+s.replace("-","");
}
function num(n){
  if(n===null||n===undefined||n==="") return "—";
  if(typeof n!=="number") return String(n);
  return n.toLocaleString("en-IN");
}
function fmt(v, money){ return money ? inr(v) : num(v); }
function cls(v){ return typeof v==="number" ? (v>0?"pos":(v<0?"neg":"")) : ""; }

/* ---------- "Fraud confirm" tick — browser me save hota hai ----------
   Tick PLAYER ke saath judta hai (rule ke saath nahi), isliye ek jagah tick karo
   to har rule tab me wahi player ticked dikhega.                              */
var LS_KEY = "miraigate_fraud_confirmed_v1";
function loadTicks(){
  try{
    var raw = window.localStorage.getItem(LS_KEY);
    if(!raw) return {};
    var o = {}, arr = JSON.parse(raw);
    if(Object.prototype.toString.call(arr)!=="[object Array]") return {};
    arr.forEach(function(x){ o[x] = 1; });
    return o;
  }catch(e){ return {}; }
}
function saveTicks(o){
  try{ window.localStorage.setItem(LS_KEY, JSON.stringify(Object.keys(o))); }catch(e){}
}
function tickedRows(ticks){
  var seen = {}, out = [];
  RULES.forEach(function(r){
    r.rows.forEach(function(x){
      if(ticks[x.id] && !seen[x.id]){ seen[x.id] = 1; out.push(x); }
    });
  });
  return out;
}
function ticksAsTSV(ticks){
  var head = ["User ID","User Code","Name","Account created","Account age (days)",
              "Naya (<30 din)","Rules toote"].join("\t");
  var lines = tickedRows(ticks).map(function(x){
    return [x.id, x.c, x.n, x.cr, x.a, x.nw?"haan":"nahi", x.hits.join(" ")].join("\t");
  });
  return [head].concat(lines).join("\n");
}
function copyText(text){
  return new Promise(function(res, rej){
    function legacy(){
      try{
        var ta = document.createElement("textarea");
        ta.value = text;
        ta.style.cssText = "position:fixed;left:-9999px;top:0";
        document.body.appendChild(ta);
        ta.focus();
        ta.select();
        var ok = document.execCommand("copy");
        ta.remove();
        ok ? res() : rej(new Error("execCommand ne mana kar diya"));
      }catch(e){ rej(e); }
    }
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(res, legacy);
    }else{
      legacy();
    }
  });
}

/* ---------- small pieces ---------- */
function Stat(p){
  return h`<div className=${"stat"+(p.hl?" hl":"")}>
    <div className="n">${p.n}</div>
    <div className="l" dangerouslySetInnerHTML=${{__html:p.l}}></div>
  </div>`;
}

function HitPills(p){
  return h`<div className="tags">
    ${p.hits.map(function(x){
      return h`<span key=${x} className=${"tag"+(x===p.self?" self":"")}>${x}</span>`;
    })}
  </div>`;
}

function WLStrip(p){
  var s = String(p.s||"");
  var out = [], run = "", last = "";
  for(var i=0;i<s.length;i++){
    if(s[i]!==last && run){ out.push([last,run]); run=""; }
    last = s[i]; run += s[i];
  }
  if(run) out.push([last,run]);
  return h`<div className="wl"><h4>Casino rounds — jeet (W) / haar (L), time order me</h4>
    <code>${out.map(function(seg,i){
      return seg[0]==="W" ? h`<b key=${i}>${seg[1]}</b>` : h`<i key=${i}>${seg[1]}</i>`;
    })}</code></div>`;
}

function ReviewBar(p){
  var n = Object.keys(p.ticks).length;
  var st = useState(""), msg=st[0], setMsg=st[1];
  var s2 = useState(""), fallback=s2[0], setFallback=s2[1];
  function say(t){ setMsg(t); setTimeout(function(){ setMsg(""); }, 3000); }

  return h`<div className="reviewwrap">
    <div className=${"reviewbar"+(n===0?" zero":"")}>
      <span className="rvn">${num(n)}</span>
      <span className="rvt">
        ${n===0
          ? h`<${React.Fragment}>Abhi tak kisi player ko <b>fraud confirm</b> nahi kiya.
              Table ke aakhri column me tick karke mark kijiye.<//>`
          : h`<${React.Fragment}>players <b>fraud confirm</b> ho chuke hain.
              Ye tick isi browser me save hai — reload karne par bhi rahega.<//>`}
      </span>
      ${msg ? h`<span className="rvmsg">${msg}</span>` : null}
      <button className="rvbtn" disabled=${n===0} onClick=${function(){
        var tsv = ticksAsTSV(p.ticks);
        setFallback("");
        copyText(tsv)
          .then(function(){ say("✓ " + n + " players copy ho gaye"); })
          .catch(function(){
            setFallback(tsv);
            say("clipboard block hai — neeche se copy kijiye");
          });
      }}>Confirmed list copy karo</button>
      <button className="rvbtn danger" disabled=${n===0} onClick=${function(){
        if(window.confirm("Saare " + n + " ticks hata dein? Ye wapas nahi aayenge.")){
          setFallback("");
          p.clear();
        }
      }}>Sab ticks hatao</button>
    </div>
    ${fallback ? h`<div className="rvfall">
      <p>Browser ne clipboard block kar diya. Neeche wale box me click karke
        <b>Ctrl+A</b> phir <b>Ctrl+C</b> dabaiye — Excel me seedha paste ho jayega.</p>
      <textarea readOnly value=${fallback} rows="8"
        onFocus=${function(e){ e.target.select(); }}></textarea>
      <button className="rvbtn" onClick=${function(){ setFallback(""); }}>Band karo</button>
    </div>` : null}
  </div>`;
}

/* ---------- overview ---------- */
function Overview(p){
  var maxD = Math.max.apply(null, META.dist.map(function(d){return d[1];}));
  return h`<div>
    <h3 className="sec">Saat rules — ek nazar me</h3>
    <p className="sub">Har card par click karke us rule ke players, threshold aur poori detail dekhiye.
      Number = us rule me kitne players flag hue.</p>
    <div className="ovgrid">
      ${RULES.map(function(r){
        var mx = r.rows.reduce(function(a,x){
          var i = r.cols.findIndex(function(c){return c.l===r.money;});
          var v = i<0?0:(x.v[i]||0); return typeof v==="number" && v>a ? v : a;
        },0);
        var nw = r.rows.filter(function(x){return x.nw;}).length;
        return h`<button key=${r.id} className="ovcard" onClick=${function(){p.go(r.id);}}>
          <div className="ovhead">
            <span className="ovid">${r.id} · NewRules #${r.num}</span>
            <span className="ovn">${r.rows.length}</span>
          </div>
          <h4 className="ovt">${r.short}</h4>
          <p className="ovg">${r.gist}</p>
          <div className="ovfoot">
            <span>naye account: ${nw}</span>
            <span>top ${inr(mx)}</span>
          </div>
        </button>`;
      })}
    </div>

    <h3 className="sec">Kitne players ek se zyada rule tod rahe hain</h3>
    <p className="sub">Ek rule tootna sanyog ho sakta hai. Jo player <strong>alag-alag tareeke se</strong>
      pakda jaye — wo sabse pakka case hai. Ye ginti data se hai, koi anumaan nahi.</p>
    <div className="olap">
      ${META.dist.map(function(d){
        return h`<div key=${d[0]} className=${"olrow"+(d[0]>=2?" hot":"")}>
          <span className="ollab">${d[0]} rule${d[0]===1?"":"s"} toote</span>
          <span className="olbar"><i style=${{width:(d[1]/maxD*100)+"%"}}></i></span>
          <span className="olct">${num(d[1])}</span>
        </div>`;
      })}
    </div>
  </div>`;
}

/* ---------- rule panel ---------- */
function RulePanel(p){
  var r = p.rule;
  var mi = r.cols.findIndex(function(c){return c.l===r.metric;});
  var vi = r.cols.findIndex(function(c){return c.l===r.money;});

  var st = useState(""), q=st[0], setQ=st[1];
  var s2 = useState(false), newOnly=s2[0], setNewOnly=s2[1];
  var s3 = useState(false), multiOnly=s3[0], setMultiOnly=s3[1];
  var s4 = useState(0), minM=s4[0], setMinM=s4[1];
  var s5 = useState({k:"metric", dir:-1}), sort=s5[0], setSort=s5[1];
  var s6 = useState(0), page=s6[0], setPage=s6[1];
  var s7 = useState(null), open=s7[0], setOpen=s7[1];
  var s8 = useState(false), tickOnly=s8[0], setTickOnly=s8[1];
  var ticks = p.ticks;

  useEffect(function(){ setQ(""); setNewOnly(false); setMultiOnly(false); setMinM(0);
    setTickOnly(false); setSort({k:"metric",dir:-1}); setPage(0); setOpen(null); }, [r.id]);

  var metricMax = useMemo(function(){
    if(mi<0) return 0;
    return r.rows.reduce(function(a,x){ var v=x.v[mi]; return (typeof v==="number"&&v>a)?v:a; },0);
  },[r.id]);

  var rows = useMemo(function(){
    var qq = q.trim().toLowerCase();
    var out = r.rows.filter(function(x){
      if(qq && x.c.toLowerCase().indexOf(qq)<0 && x.n.toLowerCase().indexOf(qq)<0
         && String(x.id).indexOf(qq)<0) return false;
      if(newOnly && !x.nw) return false;
      if(multiOnly && x.hits.length<2) return false;
      if(tickOnly && !ticks[x.id]) return false;
      if(minM>0 && mi>=0 && !(typeof x.v[mi]==="number" && x.v[mi]>=minM)) return false;
      return true;
    });
    var key = sort.k, dir = sort.dir;
    out.sort(function(a,b){
      var av, bv;
      if(key==="user"){ av=a.c.toLowerCase(); bv=b.c.toLowerCase(); }
      else if(key==="age"){ av=a.a; bv=b.a; }
      else if(key==="hits"){ av=a.hits.length; bv=b.hits.length; }
      else if(key==="metric"){ av=mi<0?0:a.v[mi]; bv=mi<0?0:b.v[mi]; }
      else { av=vi<0?0:a.v[vi]; bv=vi<0?0:b.v[vi]; }
      if(av===null||av===undefined) av = -Infinity;
      if(bv===null||bv===undefined) bv = -Infinity;
      if(av<bv) return -dir; if(av>bv) return dir; return 0;
    });
    return out;
  },[r.id,q,newOnly,multiOnly,tickOnly,minM,sort,ticks]);

  useEffect(function(){ setPage(0); setOpen(null); },[q,newOnly,multiOnly,tickOnly,minM,sort]);

  var pages = Math.max(1, Math.ceil(rows.length/PAGE));
  var pg = Math.min(page, pages-1);
  var slice = rows.slice(pg*PAGE, pg*PAGE+PAGE);
  var moneySum = vi<0 ? null : rows.reduce(function(a,x){
    var v=x.v[vi]; return a + (typeof v==="number"?v:0); },0);

  function th(key,label,right){
    var active = sort.k===key;
    return h`<th className=${right?"r":""} data-active=${active?"1":"0"}
      onClick=${function(){ setSort({k:key, dir: active ? -sort.dir : -1}); }}>
      ${label}<span className="arw">${active ? (sort.dir>0?"▲":"▼") : "↕"}</span>
    </th>`;
  }

  return h`<div>
    <div className="rulebox">
      <div className="top">
        <h2>${r.id} · ${r.short} <span className="mono" style=${{fontSize:".7em",color:"var(--muted)",fontWeight:400}}>NewRules #${r.num}</span></h2>
        <p>${r.gist}</p>
      </div>
      <div className="body">
        ${r.info.map(function(kv,i){
          return h`<div key=${i} className="blk">
            <span className="lbl">${kv[0]}</span>
            ${/threshold|kaise|galat|logic|shart|round|continue/i.test(kv[0])
              ? h`<code className="th">${kv[1]}</code>`
              : h`<p>${kv[1]}</p>`}
          </div>`;
        })}
      </div>
    </div>

    <h3 className="sec">Players — ${r.rows.length}</h3>
    <p className="sub">Kisi bhi row par click karo, us player ki poori detail khul jayegi.
      Column heading par click karke sort kar sakte ho.</p>

    <div className="filters">
      <div className="fgroup" style=${{flex:"1 1 190px"}}>
        <label className="flab" htmlFor="q">Player search</label>
        <input type="search" id="q" placeholder="user code, naam ya ID…" autoComplete="off"
          value=${q} onInput=${function(e){setQ(e.target.value);}} />
      </div>
      ${mi>=0 && h`<div className="fgroup">
        <label className="flab" htmlFor="mm">Minimum ${r.metric}
          <span className="rangeval">${num(minM)}</span></label>
        <input type="range" id="mm" min="0" max=${metricMax} value=${minM} step="1"
          onInput=${function(e){setMinM(Number(e.target.value));}} />
      </div>`}
      <div className="fgroup"><span className="flab">Account</span>
        <button className="chip" aria-pressed=${newOnly?"true":"false"}
          onClick=${function(){setNewOnly(!newOnly);}}>${"Sirf naye (<30 din)"}</button></div>
      <div className="fgroup"><span className="flab">Rules</span>
        <button className="chip" aria-pressed=${multiOnly?"true":"false"}
          onClick=${function(){setMultiOnly(!multiOnly);}}>2+ rules toote</button></div>
      <div className="fgroup"><span className="flab">Review</span>
        <button className="chip" aria-pressed=${tickOnly?"true":"false"}
          onClick=${function(){setTickOnly(!tickOnly);}}>Sirf ticked dikhao</button></div>
      <div className="fgroup"><span className="flab">${" "}</span>
        <button className="reset" onClick=${function(){
          setQ(""); setNewOnly(false); setMultiOnly(false); setTickOnly(false); setMinM(0);
        }}>Filters hatayein</button></div>
    </div>

    <div className="resbar">
      <span className="rescount"><b>${num(rows.length)}</b> players dikh rahe hain
        ${rows.length!==r.rows.length ? " (kul "+num(r.rows.length)+" me se)" : ""}</span>
      ${moneySum!==null && h`<span className="resmoney">${r.money}: <b>${inr(moneySum)}</b></span>`}
    </div>

    <div className="scroll"><table>
      <thead><tr>
        ${th("user","Player")}
        ${th("age","Account", true)}
        ${mi>=0 ? th("metric", r.metric, true) : null}
        ${vi>=0 ? th("money", r.money, true) : null}
        ${th("hits","Rules", true)}
        <th className="r"></th>
        <th className="tickhead r">Fraud confirm</th>
      </tr></thead>
      <tbody>
        ${slice.length===0 ? h`<tr><td colSpan="7"><div className="empty">
            <b>Koi player nahi mila</b>Filters thode dheele karke dekhiye.</div></td></tr>` : null}
        ${slice.map(function(x){
          var isOpen = open===x.id;
          var frag = [
            h`<tr key=${x.id} className=${"row"+(isOpen?" open":"")+(ticks[x.id]?" confirmed":"")}
              onClick=${function(){ setOpen(isOpen?null:x.id); }}>
              <td><span className="pid">${x.c}</span><span className="pname">${x.n}</span>
                ${x.nw ? h`<span className="newpill">NAYA ACCOUNT</span>` : null}</td>
              <td className="r"><span className="num">${num(x.a)}</span>
                <span className="pname">din purana</span></td>
              ${mi>=0 ? h`<td className="r"><span className=${"num "+cls(x.v[mi])}>
                  ${fmt(x.v[mi], r.cols[mi].m)}</span></td>` : null}
              ${vi>=0 ? h`<td className="r"><span className=${"num "+cls(x.v[vi])}>
                  ${fmt(x.v[vi], r.cols[vi].m)}</span></td>` : null}
              <td className="r"><span className=${"hits"+(x.hits.length>=3?" h3":(x.hits.length===2?" h2":""))}>
                  ${x.hits.length}</span>
                ${x.hits.length>1 ? h`<${HitPills} hits=${x.hits} self=${r.id} />` : null}</td>
              <td className="r exp">${isOpen?"−":"+"}</td>
              <td className="tickcell" onClick=${function(e){ e.stopPropagation(); }}>
                <input type="checkbox" className="tick" checked=${!!ticks[x.id]}
                  aria-label=${"Fraud confirm karo: "+x.c}
                  onChange=${function(){ p.toggle(x.id); }} /></td>
            </tr>`
          ];
          if(isOpen){
            var wlIdx = r.cols.findIndex(function(c){return c.l==="W/L pattern";});
            frag.push(h`<tr key=${x.id+"-d"} className="detail"><td colSpan="7"><div className="dwrap">
              <div className="dgrp"><h4>Player</h4><dl>
                <dt>User ID</dt><dd>${x.id}</dd>
                <dt>User code</dt><dd>${x.c}</dd>
                <dt>Account bana</dt><dd>${x.cr}</dd>
                <dt>Account age</dt><dd>${num(x.a)} din</dd>
                <dt>${"Naya (<30 din)"}</dt><dd className=${x.nw?"neg":""}>${x.nw?"haan":"nahi"}</dd>
                <dt>Rules toote</dt><dd>${x.hits.join(", ")}</dd>
              </dl></div>
              <div className="dgrp"><h4>${r.id} ke apne numbers</h4><dl>
                ${r.cols.map(function(c,i){
                  if(c.l==="W/L pattern") return null;
                  return h`<${React.Fragment} key=${i}>
                    <dt>${c.l}</dt>
                    <dd className=${c.m?cls(x.v[i]):""}>${fmt(x.v[i], c.m)}</dd>
                  <//>`;
                })}
              </dl></div>
              ${wlIdx>=0 && x.v[wlIdx] ? h`<${WLStrip} s=${x.v[wlIdx]} />` : null}
              ${x.hits.length>1 ? h`<p className="dnote">Ye player <b>${x.hits.length} alag rules</b>
                tod raha hai — <b>${x.hits.join(", ")}</b>. Alag-alag tareeke se ek hi baat
                saabit ho rahi hai, isliye ye single-rule wale cases se zyada pakka hai.</p>` : null}
            </div></td></tr>`);
          }
          return frag;
        })}
      </tbody>
    </table></div>

    <div className="pager">
      <span className="pginfo">Page ${pg+1} / ${pages} · ${num(rows.length)} players</span>
      <div className="pgbtns">
        <button disabled=${pg===0} onClick=${function(){setPage(0);}}>« Pehla</button>
        <button disabled=${pg===0} onClick=${function(){setPage(pg-1);}}>‹ Pichla</button>
        <button disabled=${pg>=pages-1} onClick=${function(){setPage(pg+1);}}>Agla ›</button>
        <button disabled=${pg>=pages-1} onClick=${function(){setPage(pages-1);}}>Aakhri »</button>
      </div>
    </div>
  </div>`;
}

/* ---------- app ---------- */
function App(){
  var s = useState("OV"), tab=s[0], setTab=s[1];
  useEffect(function(){ window.scrollTo({top:0,behavior:"instant"}); },[tab]);
  var rule = RULES.filter(function(r){return r.id===tab;})[0];

  var t = useState(loadTicks), ticks=t[0], setTicks=t[1];

  /* doosre browser tab me tick lage to yahan bhi update ho jaye */
  useEffect(function(){
    function sync(e){ if(e.key === LS_KEY) setTicks(loadTicks()); }
    window.addEventListener("storage", sync);
    return function(){ window.removeEventListener("storage", sync); };
  },[]);

  function toggle(id){
    setTicks(function(prev){
      var next = {}, k;
      for(k in prev) if(prev[k]) next[k] = 1;
      if(next[id]) delete next[id]; else next[id] = 1;
      saveTicks(next);
      return next;
    });
  }
  function clearTicks(){ saveTicks({}); setTicks({}); }

  return h`<${React.Fragment}>
    <header>
      <p className="eyebrow">${META.org} · Fraud Detection</p>
      <h1>Seven Rules Fraud Console</h1>
      <p className="lede">Saat rules ki <strong>final</strong> lists — jaisa har rule me likha hai
        theek waisa hi lagaya gaya, uske upar kuch joda nahi. Har player ke saath wahi numbers hain
        jinki wajah se wo flag hua.</p>
      <div className="stats">
        <${Stat} n=${num(META.usersUnique)} l="<b>players</b> flagged, saare rules milakar" />
        <${Stat} n=${num(META.hitsTotal)} l="<b>rule-hits</b> — ek player 2 rules me ho sakta hai" />
        <${Stat} n=${META.rules} l="<b>rules</b> jo is data par chal sakte the" />
        <${Stat} hl=${true} n=${num(META.multi)} l="players <b>2 ya zyada rules</b> tod rahe hain — sabse pakke case" />
      </div>
      <${ReviewBar} ticks=${ticks} clear=${clearTicks} />
      <div className="tabs" role="tablist">
        <button role="tab" aria-selected=${tab==="OV"?"true":"false"}
          onClick=${function(){setTab("OV");}}>Overview</button>
        ${RULES.map(function(r){
          return h`<button key=${r.id} role="tab" aria-selected=${tab===r.id?"true":"false"}
            onClick=${function(){setTab(r.id);}}>${r.id} ${r.short}
            <span className="c">${r.rows.length}</span></button>`;
        })}
      </div>
    </header>

    ${tab==="OV"
      ? h`<${Overview} go=${setTab} />`
      : h`<${RulePanel} key=${tab} rule=${rule} ticks=${ticks} toggle=${toggle} />`}

    <div className="note">
      <h3>Ek zaroori baat</h3>
      <p><strong>Flagged ka matlab "review karo" hai — confirmed fraud nahi.</strong>
        Har list us rule ke apne exact threshold se bani hai. Koi verdict ya score
        upar se nahi joda gaya.</p>
      <p>Sabse pehle un <strong>${num(META.multi)} players</strong> ko dekhiye jo
        <strong>2 ya zyada rules</strong> tod rahe hain — kisi bhi rule tab me
        "2+ rules toote" filter se. Ek rule sanyog ho sakta hai, do nahi.</p>
      <p>Rule ka apna profit aur player ka <strong>overall ${"P&L"} alag cheezein hain</strong>.
        Rule ka profit sirf us market/session ka hai. Dono column me diye hain — faisla
        dono dekhkar lijiye.</p>
      <p><strong>"Fraud confirm" tick isi browser me save hota hai</strong> — reload aur
        band karne par bhi rahega, par doosre laptop ya doosre browser me nahi dikhega.
        Tick player ke saath juda hai, rule ke saath nahi: ek jagah tick karoge to har
        rule tab me wahi player ticked milega. Kaam khatam hone par upar
        <strong>"Confirmed list copy karo"</strong> se poori list nikaal lijiye.</p>
    </div>

    <footer>
      <span>${META.org}</span>
      <span>${META.rules} rules · final lists</span>
      <span>${num(META.usersUnique)} unique players</span>
      <span>${META.window}</span>
    </footer>
  <//>`;
}

ReactDOM.createRoot(document.getElementById("root")).render(h`<${App} />`);
})();
</script>
