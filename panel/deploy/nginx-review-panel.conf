# Review panel. The panel has its own sign-in page; nginx limits how fast sign-in can be tried.
# certbot adds the HTTPS (443) block and the HTTP -> HTTPS redirect.
limit_req_zone $binary_remote_addr zone=panel_login:1m rate=10r/m;

# Keep the scheme set by a load balancer or CDN in front of this server, if there is one.
map $http_x_forwarded_proto $panel_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;
    server_tokens off;

    client_max_body_size 1m;
    gzip on;
    gzip_types application/json text/css application/javascript;
    gzip_min_length 1024;

    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $panel_proto;
    proxy_read_timeout 60s;

    location = /api/login {
        limit_req zone=panel_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8080;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
    }
}
